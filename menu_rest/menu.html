<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Menú</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: auto; padding: 20px; background-color: #fdfaf6; }
        header { text-align: center; padding: 40px 0; }
        .menu-section { margin-bottom: 40px; }
        .section-title { border-bottom: 2px solid #8d6e63; color: #5d4037; text-transform: uppercase; letter-spacing: 2px; }
        .item { display: flex; justify-content: space-between; margin: 10px 0; font-size: 1.1em; }
        .price { font-weight: bold; color: #2e7d32; }
        .decor-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>

<header>
    <h1>🍽 Nuestro Menú</h1>
    <img src="images/header-decor.jpg" alt="Decoración" class="decor-img">
</header>

<div id="menu-container">
    </div>

<script>
    // Your specific Google Sheets CSV export link
    const sheetURL = 'https://docs.google.com/spreadsheets/d/14gD_HycpGeMo9x45kG5pYTKxl-yG-cN4tyYR25obW-k/gviz/tq?tqx=out:csv';
    const sectionOrder = ["entradas", "principales", "postres"];

    async function loadMenu() {
        try {
            // Adding a timestamp prevents the browser from showing "old" prices
            const response = await fetch(`${sheetURL}&v=${new Date().getTime()}`);
            const data = await response.text();
            
            // Google Sheets CSV often wraps text in quotes: "Item Name","10.00","type"
            // This regex cleans those quotes up
            const rows = data.split('\n').slice(1); 
            const menuItems = rows.map(row => {
                const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return {
                    name: columns[0]?.replace(/"/g, '').trim(),
                    price: columns[1]?.replace(/"/g, '').trim(),
                    type: columns[2]?.replace(/"/g, '').trim().toLowerCase()
                };
            });

            const container = document.getElementById('menu-container');
            container.innerHTML = ''; // Clear "Loading..." text

            sectionOrder.forEach(section => {
                const filteredItems = menuItems.filter(item => item.type === section);
                
                if (filteredItems.length > 0) {
                    const sectionHtml = `
                        <section class="menu-section">
                            <h2 class="section-title" style="text-transform: capitalize;">${section}</h2>
                            ${filteredItems.map(item => `
                                <div class="item">
                                    <span>${item.name}</span>
                                    <span class="price">$${item.price}</span>
                                </div>
                            `).join('')}
                        </section>
                    `;
                    container.innerHTML += sectionHtml;
                }
            });
        } catch (error) {
            console.error("Error loading menu:", error);
            document.getElementById('menu-container').innerHTML = "Error al cargar el menú.";
        }
    }

    loadMenu();
</script>
</body>
</html>
